{% if sidebarBackLink %}
<div class="w-full flex flex-between mb-4">
    <nav class="flex-1 pt-6">
        <ol class="mb-0 mx-0 text-xsm flex items-center">
            <li class="list-none inline ml-0">
                <a hx-boost="true" hx-target="#content-wrap" hx-select="#content-wrap" hx-swap="outerHTML show:no-scroll swap:0s" hx-indicator="#loadingIndicator" class="text-gray-600 hover:text-gray-800 no-underline hover:cursor-pointer breadcrumb" href="{{ sidebarBackLink.url }}">
                    {{ '< ' ~ sidebarBackLink.label }}
                </a>
            </li>
        </ol>
    </nav>
</div>
{% endif %}
