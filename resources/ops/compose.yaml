name: gibbon

services:
    app:
        build:
            context: .
            dockerfile: resources/ops/Dockerfile
            args:
                PHP_VERSION: ${PHP_VERSION:-8.3}
        container_name: gibbon_app
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped
        # Mark the app healthy once Apache answers on port 80.
        healthcheck:
            test: ["CMD", "php", "-r", "exit(fsockopen('127.0.0.1', 80) ? 0 : 1);"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            web-tier:
                aliases:
                    - gibbon.test
            db-tier:

    db:
        image: mysql:${MYSQL_VERSION:-8.0}
        container_name: gibbon_db
        environment:
            MYSQL_DATABASE: ${MYSQL_DATABASE:-gibbon}
            MYSQL_USER: ${MYSQL_USER:-gibbon}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is not set. Copy resources/ops/configuration/gibbon/.env-example to .env and set a password.}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is not set. Copy resources/ops/configuration/gibbon/.env-example to .env and set a password.}
            TZ: ${TIMEZONE:-UTC}
        ports:
            # Localhost only: the dev database must not be reachable from the network.
            - "127.0.0.1:${DB_PORT:-3306}:3306"
        volumes:
            - gibbon_db_data:/var/lib/mysql
        command: --default-authentication-plugin=mysql_native_password --max-allowed-packet=256M
        healthcheck:
            # A real query: mysqladmin ping succeeds even when credentials are wrong.
            # $$ reads the password from container env, not from the compose config.
            test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1'"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart: unless-stopped
        networks:
            - db-tier

    # Optional mail catcher. Enable with COMPOSE_PROFILES=mail in .env, then
    # open http://localhost:8025. SMTP host: mail, port: 1025.
    mail:
        image: axllent/mailpit:v1
        profiles:
            - mail
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: "true"
            MP_SMTP_AUTH_ALLOW_INSECURE: "true"
        ports:
            - "127.0.0.1:8025:8025"
        networks:
            - web-tier

    test:
        build:
            context: .
            dockerfile: resources/ops/Dockerfile
            args:
                PHP_VERSION: ${PHP_VERSION:-8.3}
        volumes:
            - .:/var/www/html
            - ./resources/ops/configuration/php/gibbon.ini:/usr/local/etc/php/conf.d/gibbon.ini:ro
        environment:
            TEST_ENV: ${TEST_ENV:-codeception}
            ABSOLUTE_URL: ${TEST_ABSOLUTE_URL:-http://gibbon.test}
            DB_HOST: ${MYSQL_HOST:-gibbon_db}
            DB_NAME: ${MYSQL_DATABASE:-gibbon}
            DB_USERNAME: ${MYSQL_USER:-gibbon}
            DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is not set. Copy resources/ops/configuration/gibbon/.env-example to .env and set a password.}
        networks:
            - web-tier
            - db-tier
        depends_on:
            app:
                condition: service_healthy
            db:
                condition: service_healthy

networks:
    web-tier:
    db-tier:

volumes:
    gibbon_db_data:
