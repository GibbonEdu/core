name: gibbon

services:
    app:
        build:
            # Context is project root so COPY . . captures all source code
            context: .
            # Path to Dockerfile is relative to the build context (project root)
            dockerfile: resources/ops/Dockerfile
            args:
                PHP_VERSION: ${PHP_VERSION:-8.3}
        container_name: gibbon_app
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped
        networks:
            web-tier:
                ipv4_address: 172.16.238.10
            db-tier:

    db:
        image: mysql:${MYSQL_VERSION:-8.0}
        container_name: gibbon_db

        # Gibbon Docker Environment Variables
        environment:
            # MySQL database name (default: gibbon)
            - MYSQL_DATABASE=${MYSQL_DATABASE:-gibbon}
            # MySQL application user credentials
            - MYSQL_USER=${MYSQL_USER:-gibbon}
            - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD is not set. Create .env from resources/ops/configuration/gibbon/.env-example and set a password.}
            # MySQL root password — keep this strong in production
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is not set. Create .env from resources/ops/configuration/gibbon/.env-example and set a password.}
        ports:
            - target: 3306
              published: 3306
              protocol: tcp
              mode: host
        volumes:
            - gibbon_db_data:/var/lib/mysql
        # Native password plugin ensures PHP can connect easily
        command: --default-authentication-plugin=mysql_native_password
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart: unless-stopped
        networks:
            - db-tier

    config:
        image: rija/docker-alpine-shell-tools:1.0.1
        volumes:
            - ../../:/var/www/html
        command: /var/www/html/resources/ops/scripts/generate_config.sh

    test:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                PHP_VERSION: ${PHP_VERSION:-8.3}
        container_name: gibbon_test
        volumes:
            ## Mount project root so live edits are immediately reflected without rebuilding the image.
            - ../..:/var/www/html
            ## Mount PHP config so values can be changed without an image rebuild.
            - ./ops/configuration/php/gibbon.ini:/usr/local/etc/php/conf.d/gibbon.ini:ro
        networks:
            - web-tier
            - db-tier
        extra_hosts:
            - "gibbon.test:172.16.238.10"

networks:
    web-tier:
        driver: bridge
        ipam:
            driver: default
            config:
                - subnet: 172.16.238.0/24
    db-tier:

volumes:
    gibbon_db_data:
