apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gibbon-ingress
  namespace: demo-app-deployment
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-edit-in-place: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: banthach-demo.vanhoa.edu.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gibbon-service
                port:
                  number: 80
  tls:
    - hosts:
        - banthach-demo.vanhoa.edu.vn
      secretName: gibbon-demo-tls
