apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gibbon-ingress
  namespace: demo-app-deployment
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"  # ✅ Allow ACME to work
    nginx.ingress.kubernetes.io/enable-global-auth: "false"  # Optional if auth used    
spec:
  ingressClassName: nginx
  rules:
    - host: banthach-demo.vanhoa.edu.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gibbon-service
                port:
                  number: 80
  tls:
    - hosts:
        - banthach-demo.vanhoa.edu.vn
      secretName: gibbon-demo-tls
