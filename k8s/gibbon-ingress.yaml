# Certificate - production
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gibbon-demo-tls
  namespace: gibbon-demo-deploy
spec:
  secretName: gibbon-demo-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - gibbon-demo.vanhoa.edu.vn
---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gibbon-demo-ingress
  namespace: gibbon-demo-deploy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging   # keep staging for test
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    acme.cert-manager.io/http01-edit-in-place: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
spec:
  ingressClassName: nginx
  rules:
    - host: gibbon-demo.vanhoa.edu.vn     # <— CHANGE HERE if you prefer another host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gibbon-demo-service
                port:
                  number: 80
  tls:
    - hosts:
        - gibbon-demo.vanhoa.edu.vn        # <— CHANGE HERE to match the host above
      secretName: gibbon-demo-tls
