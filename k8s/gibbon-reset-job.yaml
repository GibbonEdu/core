#gibbon-reset-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: gibbon-reset-job
  namespace: demo-app-deployment
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        role: app-demo-1
      containers:
      - name: reset
        image: mysql:5.7
        command: ["/bin/bash", "-c"]
        args:
          - |
            echo "[Reset Job] Waiting for MySQL to become available..."
            until mysqladmin ping -h gibbon-mysql -u root -p$MYSQL_ROOT_PASSWORD --silent; do
              echo "[Reset Job] MySQL not ready, sleeping..."
              sleep 5
            done

            echo "[Reset Job] Dropping and recreating 'gibbon' database..."
            mysql -h gibbon-mysql -u root -p$MYSQL_ROOT_PASSWORD -e "DROP DATABASE IF EXISTS gibbon; CREATE DATABASE gibbon;"
            echo "[Reset Job] Done."
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gibbon-db-secret
              key: password
