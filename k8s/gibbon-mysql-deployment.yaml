apiVersion: apps/v1
kind: Deployment
metadata:
  name: gibbon-mysql
  namespace: demo-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gibbon-mysql
  template:
    metadata:
      labels:
        app: gibbon-mysql
    spec:
      initContainers:
        - name: mysql-init-user
          image: mysql:5.7
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for MySQL to start..."
              until mysql -h localhost -u root -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1"; do
                sleep 5
              done
              echo "Granting remote access to gibbonuser..."
              mysql -h localhost -u root -p"$MYSQL_ROOT_PASSWORD" -e "GRANT ALL PRIVILEGES ON gibbon.* TO 'gibbonuser'@'%' IDENTIFIED BY '$MYSQL_PASSWORD'; FLUSH PRIVILEGES;"
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibbon-db-secret
                  key: password
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibbon-db-secret
                  key: password
      containers:
        - name: mysql
          image: mysql:5.7
          env:
            - name: MYSQL_DATABASE
              value: gibbon
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibbon-db-secret
                  key: password
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: gibbon-db-secret
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibbon-db-secret
                  key: password
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: gibbon-mysql-pvc
