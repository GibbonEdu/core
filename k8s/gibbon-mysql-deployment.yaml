# gibbon-mysql-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gibbon-dev-mysql
  namespace: gibbon-dev-deploy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gibbon-dev-mysql
  template:
    metadata:
      labels:
        app: gibbon-dev-mysql
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mysql
          image: mysql:5.7
          env:
            - name: MYSQL_DATABASE
              value: gibbon
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: password
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: password
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          readinessProbe:            #  belongs under the container
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: gibbon-dev-mysql-pvc
      terminationGracePeriodSeconds: 30
---
# ---------- 
# mysql service
# --------
apiVersion: v1
kind: Service
metadata:
  name: gibbon-dev-mysql
  namespace: gibbon-dev-deploy
spec:
  selector:
    app: gibbon-dev-mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
---
# -----------------
# PersistentVolume for MySQL
# -----------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gibbon-dev-mysql-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs
  nfs:
    server: 10.1.0.5
    path: /mnt/k8s-database-and-storage/gibbon-dev-mysql
---
# -----------------
# PersistentVolumeClaim for MySQL
# -----------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gibbon-dev-mysql-pvc
  namespace: gibbon-dev-deploy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: nfs
---
# -------------------------
# Job: Grant Privileges to Gibbon User
# -------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: gibbon-dev-mysql-grant-job
  namespace: gibbon-dev-deploy
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mysql-grant
          image: mysql:5.7
          command:
            - /bin/sh
            - -c
            - |
              echo "Granting privileges to gibbonuser..."
              mysql -h gibbon-mysql.gibbon-dev.svc.cluster.local \
                -u root -p"$MYSQL_ROOT_PASSWORD" -e "\
                GRANT ALL PRIVILEGES ON gibbon.* TO '$MYSQL_USER'@'%'; \
                FLUSH PRIVILEGES;"
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: password
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: username
