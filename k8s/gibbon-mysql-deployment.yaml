# ---------------------------
# PersistentVolumeClaim (MySQL) — Dynamic
# ---------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gibbon-dev-mysql-pvc
  namespace: gibbon-dev-deploy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: nfs
---
# ---------------------------
# Deployment — MySQL (DEV)
# ---------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gibbon-dev-mysql
  namespace: gibbon-dev-deploy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gibbon-dev-mysql
  template:
    metadata:
      labels:
        app: gibbon-dev-mysql
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mysql
          image: mysql:5.7
          env:
            - name: MYSQL_DATABASE
              value: gibbon
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: password
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: password
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 10        
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: gibbon-dev-mysql-pvc
---
# ---------------------------
# Service — MySQL (DEV)
# ---------------------------
apiVersion: v1
kind: Service
metadata:
  name: gibbon-dev-mysql
  namespace: gibbon-dev-deploy
spec:
  selector:
    app: gibbon-dev-mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
---
# -------------------------
# Job: Grant Privileges to Gibbon User — DEV
# -------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: gibbon-dev-mysql-grant-job
  namespace: gibbon-dev-deploy
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mysql-grant
          image: mysql:5.7
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              echo "Waiting for MySQL at ${HOST}..."
              for i in $(seq 1 150); do
                if mysqladmin --connect-timeout=2 ping -h "${HOST}" -uroot -p"${MYSQL_ROOT_PASSWORD}" >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done

              echo "Ensuring DB/user/grants..."
              # Detect major version (5 vs 8) to pick ALTER USER syntax (safe even on 5.7)
              MAJOR="$(MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysql -h "${HOST}" -uroot -Nse "SELECT SUBSTRING_INDEX(VERSION(),'.',1)")"
              if [ "${MAJOR}" -ge 8 ] 2>/dev/null; then
                ALTER_STMT="ALTER USER '${MYSQL_USER}'@'%' IDENTIFIED WITH mysql_native_password BY '${MYSQL_PASSWORD}'"
              else
                ALTER_STMT="ALTER USER '${MYSQL_USER}'@'%' IDENTIFIED BY '${MYSQL_PASSWORD}'"
              fi

              MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysql -h "${HOST}" -uroot -e "
              CREATE DATABASE IF NOT EXISTS \`${MYSQL_DATABASE}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              CREATE USER IF NOT EXISTS '${MYSQL_USER}'@'%' IDENTIFIED BY '${MYSQL_PASSWORD}';
              ${ALTER_STMT};
              GRANT ALL PRIVILEGES ON \`${MYSQL_DATABASE}\`.* TO '${MYSQL_USER}'@'%';
              FLUSH PRIVILEGES;

              echo "Grants applied."
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: password
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: password
            - name: MYSQL_DATABASE
              value: gibbon