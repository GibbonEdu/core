apiVersion: v1
kind: PersistentVolume
metadata:
  name: gibbon-files-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 10.1.0.5
    path: /mnt/k8s-database-and-storage/gibbon-files
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gibbon-files-pvc
  namespace: demo-app-deployment
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gibbon
  namespace: demo-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gibbon
  template:
    metadata:
      labels:
        app: gibbon
    spec:
      containers:
        - name: gibbon
          image: bitnami/apache-php:8.1
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: gibbon-files
              mountPath: /app/uploads
          env:
            - name: GIBBON_DB_HOST
              value: gibbon-mariadb
            - name: GIBBON_DB_NAME
              value: gibbon
            - name: GIBBON_DB_USER
              value: gibbonuser
            - name: GIBBON_DB_PASSWORD
              value: gibbonpass
      volumes:
        - name: gibbon-files
          persistentVolumeClaim:
            claimName: gibbon-files-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gibbon
  namespace: demo-app-deployment
spec:
  selector:
    app: gibbon
  ports:
    - port: 80
      targetPort: 8080
