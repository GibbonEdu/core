# -----------------
# PersistentVoume
# -----------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gibbon-dev-uploads-pv
  labels:
    app: gibbon
    env: dev
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 10.1.0.5
    path: /mnt/k8s-database-and-storage/gibbon-dev-files
---
# ---------------------------
# PersistentVolumeClaim
# ---------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gibbon-dev-uploads-pvc
  namespace: gibbon-dev
  labels:
    app: gibbon
    env: dev
spec:
  volumeName: gibbon-dev-uploads-pv
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  selector:
    matchLabels:
      app: gibbon
      env: dev
---
# ---------------------------
# ClusterIP Service for Gibbon Web App
# ---------------------------
apiVersion: v1
kind: Service
metadata:
  name: gibbon-service
  namespace: gibbon-dev
  labels:
    app: gibbon
    env: dev
spec:
  selector:
    app: gibbon
    env: dev
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
# gibbon-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gibbon-dev-app
  namespace: gibbon-dev
  labels:
    app: gibbon
    env: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gibbon
      env: dev
  template:
    metadata:
      labels:
        app: gibbon
        env: dev
    spec:
      nodeSelector:
          role: app-demo-1 # Change this if need to use another node
      securityContext:
        fsGroup: 33    #www-data
      initContainers:
        - name: init-gibbon-perms
          image: busybox
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "[Init] Ensure config.php exists and uploads perms..."
              mkdir -p /var/www/html/gibbon/uploads/tmp /var/www/html/gibbon/uploads/cache              
              chown -R 33:33 /var/www/html/gibbon /var/www/html/gibbon/uploads
              chmod 664 /var/www/html/gibbon/config.php
              chmod -R 0777 /var/www/html/gibbon/uploads
          volumeMounts:
            - name: uploads
              mountPath: /var/www/html/gibbon/uploads              
      containers:
        - name: gibbon
          image: ntony3419/gibbon:v29-fixed-path
          imagePullPolicy: Always
          command: ["/bin/sh","-lc"]
          args: ["apache2ctl -D FOREGROUND"]
          startupProbe:
            httpGet:
                path: /
                port: 80
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:            # belongs under the container
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          ports:
            - containerPort: 80
          volumeMounts:
            - name: uploads
              mountPath: /var/www/html/gibbon/uploads              
          env:
            - name: DB_HOST
              value: gibbon-mysql.gibbon-dev.svc.cluster.local
            - name: DB_NAME
              value: gibbon_dev gibbon_dev 
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: password
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: gibbon-dev-uploads-pvc
