# gibbon-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gibbon-app
  namespace: demo-app-deployment
  labels:
    app: gibbon
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gibbon
  template:
    metadata:
      labels:
        app: gibbon
    spec:
      nodeSelector:
          role: app-demo-1
      initContainers:
        - name: init-gibbon-perms
          image: busybox
          command:
            - /bin/sh
            - -c
            - |
              echo "[Init] Removing config.php and setting uploads permissions..."
              rm -f /var/www/html/config.php
              mkdir -p /var/www/html/uploads/tmp /var/www/html/uploads/cache
              chmod -R 0777 /var/www/html/uploads
          volumeMounts:
            - name: gibbon-uploads
              mountPath: /var/www/html/uploads
      containers:
        - name: gibbon
          image: ntony3419/gibbon:v29-fix-perm
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: gibbon-uploads
              mountPath: /var/www/html/uploads
#          lifecycle:
 #           postStart:
  #            exec:
         #       command: ["/bin/sh", "-c", "chmod -R 0777 /var/www/html/uploads"]
   #              command: ["/bin/sh", "-c", "..."]
          env:
            - name: DB_HOST
              value: gibbon-mysql.demo-app-deployment.svc.cluster.local
            - name: DB_NAME
              value: gibbon
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: gibbon-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibbon-db-secret
                  key: password
      volumes:
        - name: gibbon-uploads
          persistentVolumeClaim:
            claimName: gibbon-uploads-pvc
