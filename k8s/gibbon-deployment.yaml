# ---------------------------
# PersistentVolumeClaim (Uploads) - Dynamic
# ---------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gibbon-dev-uploads-pvc
  namespace: gibbon-dev-deploy
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs
---
# ---------------------------
# ClusterIP Service for Gibbon Web App - DEV
# ---------------------------
apiVersion: v1
kind: Service
metadata:
  name: gibbon-dev-service
  namespace: gibbon-dev-deploy
spec:
  selector:
    app: gibbon-dev
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
# ---------------------------
# Deployment - Gibbon App (DEV)
# ---------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gibbon-dev-app
  namespace: gibbon-dev-deploy
  labels:
    app: gibbon-dev
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: gibbon-dev
  template:
    metadata:
      labels:
        app: gibbon-dev
      annotations:  # Jenkins will overwrite/refresh this annotation to force rollout on secret changes
        secret.openai.rv: "bootstrap"
    spec:
      nodeSelector:
        role: app-demo-1
      securityContext:
        fsGroup: 33
      imagePullSecrets:
        - name: dockerhub-cred
      initContainers:
        - name: init-gibbon-data
          image: busybox:1.36
          command: ["/bin/sh","-c"]
          args:
            - |
              set -ex
              mkdir -p /pvc/config /pvc/i18n \
                       /var/www/html/gibbon/uploads/tmp /var/www/html/gibbon/uploads/cache
              [ -s /pvc/.gibbon_guid ] || (cat /proc/sys/kernel/random/uuid 2>/dev/null || date +%s%N) > /pvc/.gibbon_guid
              if [ ! -s /pvc/config/config.php ]; then
                printf '%s\n' \
                  '<?php' \
                  '$databaseServer   = getenv("DB_HOST");' \
                  '$databaseUsername = getenv("DB_USER");' \
                  '$databasePassword = getenv("DB_PASSWORD");' \
                  '$databaseName     = getenv("DB_NAME");' \
                  '$guid = getenv("GIBBON_GUID");' \
                  'if (!$guid) {' \
                  '  $guidFile = __DIR__ . "/../.gibbon_guid";' \
                  '  if (is_readable($guidFile)) { $guid = trim(file_get_contents($guidFile)); }' \
                  '}' \
                  '$caching     = 10;' \
                  '$absoluteURL = getenv("ABSOLUTE_URL");' \
                > /pvc/config/config.php
                chown 33:33 /pvc/config/config.php || true
                chmod 0660 /pvc/config/config.php || true
              fi
              chown -R 33:33 /var/www/html/gibbon/uploads || true
              chmod -R 0777 /var/www/html/gibbon/uploads || true
          env:
            - name: DB_HOST
              value: gibbon-dev-mysql.gibbon-dev-deploy.svc.cluster.local
            - name: DB_NAME
              value: gibbon
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: password
            - name: ABSOLUTE_URL
              value: "https://gibbon-dev.vanhoa.edu.vn"
          volumeMounts:
            - name: uploads
              mountPath: /pvc
            - name: uploads
              mountPath: /var/www/html/gibbon/uploads

        # Seed/refresh vi_VN MO into PVC from the SAME app image
        - name: init-seed-i18n
          image: docker.io/ntony3419/gibbon:dev-latest   # Jenkins updates this to the build tag
          imagePullPolicy: Always
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu
              SRC="/var/www/html/gibbon/resources/locale/vi_VN/LC_MESSAGES/gibbon.mo"
              DST="/pvc/i18n/vi_VN/LC_MESSAGES/gibbon.mo"
              if [ ! -f "$DST" ] && [ -f "$SRC" ]; then
                mkdir -p "$(dirname "$DST")"
                cp -v "$SRC" "$DST"
                chown 33:33 "$DST" || true
              fi
          volumeMounts:
            - { name: uploads, mountPath: /pvc }

      containers:
        - name: gibbon
          image: docker.io/ntony3419/gibbon:dev-latest      # Jenkins updates this to the build tag
          imagePullPolicy: Always
          command: ["/bin/sh","-c"]
          args: ["exec env -u OPENAI_API_KEY apache2ctl -D FOREGROUND"]
          ports:
            - containerPort: 80
          startupProbe:
            httpGet: { path: "/", port: 80 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          env:
            - name: DB_HOST
              value: gibbon-dev-mysql.gibbon-dev-deploy.svc.cluster.local
            - name: DB_NAME
              value: gibbon
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: password
            - name: ABSOLUTE_URL
              value: "https://gibbon-dev.vanhoa.edu.vn"
              # Point PHP to the secret file
            - name: OPENAI_API_KEY_FILE
              value: /run/secrets/openai/OPENAI_API_KEY

          volumeMounts:
            - name: uploads
              mountPath: /var/www/html/gibbon/uploads
            - name: uploads
              mountPath: /var/www/html/gibbon/config.php
              subPath: config/config.php
              readOnly: true
            - name: uploads
              mountPath: /var/www/html/gibbon/i18n
              subPath: i18n
            # Mount the OpenAI secret (the Secret name will be patched by Jenkins)
            - name: openai-secret
              mountPath: /run/secrets/openai              
              readOnly: true
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: gibbon-dev-uploads-pvc
        # Secret volume; secretName will be patched to the current version by Jenkins
        - name: openai-secret
          secret:
            secretName: gibbon-dev-openai
            optional: false
            items:
              - key: OPENAI_API_KEY
                path: OPENAI_API_KEY
