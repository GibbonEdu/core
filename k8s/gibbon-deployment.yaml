apiVersion: apps/v1
kind: Deployment
metadata:
  name: gibbon
  namespace: demo-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gibbon
  template:
    metadata:
      labels:
        app: gibbon
    spec:
      containers:
        - name: gibbon
          image: ntung97/gibbonedu:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: gibbon-uploads
              mountPath: /var/www/html/uploads
      volumes:
        - name: gibbon-uploads
          persistentVolumeClaim:
            claimName: gibbon-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gibbon-service
  namespace: demo-app-deployment
spec:
  selector:
    app: gibbon
  ports:
    - port: 80
      targetPort: 80
