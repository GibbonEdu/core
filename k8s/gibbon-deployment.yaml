# ---------------------------
# PersistentVolumeClaim (Uploads) — Dynamic
# ---------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gibbon-dev-uploads-pvc
  namespace: gibbon-dev-deploy
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs
---
# ---------------------------
# ClusterIP Service for Gibbon Web App — DEV
# ---------------------------
apiVersion: v1
kind: Service
metadata:
  name: gibbon-dev-service
  namespace: gibbon-dev-deploy
spec:
  selector:
    app: gibbon-dev
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
# ---------------------------
# Deployment — Gibbon App (DEV)
# ---------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gibbon-dev-app
  namespace: gibbon-dev-deploy
  labels:
    app: gibbon-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gibbon-dev
  template:
    metadata:
      labels:
        app: gibbon-dev
    spec:
      nodeSelector:
        role: app-demo-1
      securityContext:
        fsGroup: 33    # www-data
      initContainers:
        - name: init-gibbon-perms
          image: busybox
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "[Init] Ensure config.php exists and uploads perms..."
              mkdir -p /var/www/html/gibbon/uploads/tmp /var/www/html/gibbon/uploads/cache
              : > /var/www/html/gibbon/config.php
              chown -R 33:33 /var/www/html/gibbon /var/www/html/gibbon/uploads
              chmod 664 /var/www/html/gibbon/config.php
              chmod -R 0777 /var/www/html/gibbon/uploads
          volumeMounts:
            - name: uploads
              mountPath: /var/www/html/gibbon/uploads
              readOnly: false
      containers:
        - name: gibbon
          image: ntony3419/gibbon:v29-fixed-path
          imagePullPolicy: Always
          command: ["/bin/sh","-lc"]
          args: ["apache2ctl -D FOREGROUND"]
          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          ports:
            - containerPort: 80
          volumeMounts:
            - name: uploads
              mountPath: /var/www/html/gibbon/uploads
              readOnly: false
          env:
            - name: DB_HOST
              value: gibbon-dev-mysql.gibbon-dev-deploy.svc.cluster.local
            - name: DB_NAME
              value: gibbon
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: password
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: gibbon-dev-uploads-pvc
