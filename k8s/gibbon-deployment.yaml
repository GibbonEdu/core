# ---------------------------
# PersistentVolumeClaim (Uploads) - Dynamic
# ---------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gibbon-dev-uploads-pvc
  namespace: gibbon-dev-deploy
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs
---
# ---------------------------
# ClusterIP Service for Gibbon Web App - DEV
# ---------------------------
apiVersion: v1
kind: Service
metadata:
  name: gibbon-dev-service
  namespace: gibbon-dev-deploy
spec:
  selector:
    app: gibbon-dev
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
# ---------------------------
# Deployment - Gibbon App (DEV)
# ---------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gibbon-dev-app
  namespace: gibbon-dev-deploy
  labels:
    app: gibbon-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gibbon-dev
  template:
    metadata:
      labels:
        app: gibbon-dev
    spec:
      nodeSelector:
        role: app-demo-1
      securityContext:
        fsGroup: 33
      initContainers:
        - name: init-gibbon-perms
          image: busybox:1.36
          command: ["/bin/sh","-c"]
          args:
            - |
              set -ex
              echo "[Init] Prepare uploads + config on PVC"
              mkdir -p /var/www/html/gibbon/uploads/config /var/www/html/gibbon/uploads/tmp /var/www/html/gibbon/uploads/cache /pvc/config
              [ -s /pvc/.gibbon_guid ] || (cat /proc/sys/kernel/random/uuid 2>/dev/null || date +%s%N) > /pvc/.gibbon_guid
              if [ ! -s /pvc/config/config.php ]; then
                printf '%s\n' \
                  '<?php' \
                  '$databaseServer   = getenv("DB_HOST");' \
                  '$databaseUsername = getenv("DB_USER");' \
                  '$databasePassword = getenv("DB_PASSWORD");' \
                  '$databaseName     = getenv("DB_NAME");' \
                  '$guid = getenv("GIBBON_GUID");' \
                  'if (!$guid) {' \
                  '  $guidFile = __DIR__ . "/../.gibbon_guid";' \
                  '  if (is_readable($guidFile)) { $guid = trim(file_get_contents($guidFile)); }' \
                  '}' \
                  '$caching     = 10;' \
                  '$absoluteURL = getenv("ABSOLUTE_URL");' \
                > /pvc/config/config.php
                chown 33:33 /pvc/config/config.php || true
                chmod 0660 /pvc/config/config.php || true
                echo "[Init] Wrote /pvc/config/config.php"
              else
                echo "[Init] Using existing /pvc/config/config.php"
              fi
              chown -R 33:33 /var/www/html/gibbon/uploads || true
              chmod -R 0777 /var/www/html/gibbon/uploads || true
          env:
            - name: DB_HOST
              value: gibbon-dev-mysql.gibbon-dev-deploy.svc.cluster.local
            - name: DB_NAME
              value: gibbon
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: password
            - name: ABSOLUTE_URL
              value: "https://gibbon-dev.vanhoa.edu.vn"
          volumeMounts:
            - name: uploads
              mountPath: /var/www/html/gibbon/uploads
            - name: uploads
              mountPath: /pvc
        - name: init-gibbon
          image: ntony3419/gibbon:v29-fixed-path
          command: ["/bin/sh","-c"]
          args:
            - |
              # Log everything to the PVC so we can read it from the app pod later
              LOG=/var/www/html/gibbon/uploads/init-gibbon.log
              mkdir -p /var/www/html/gibbon/uploads || true

              exec >"$LOG" 2>&1
              set -eu
              echo "[Init] $(date -Iseconds) starting"
              echo "[Init] Prepare config/uploads/locale on PVC"
              SRC="/var/www/html/gibbon/resources/locale"
              DST="/pvc/locale"
              # Ensure dirs exist
              mkdir -p /pvc/config "$DST" \
                       /var/www/html/gibbon/uploads/tmp /var/www/html/gibbon/uploads/cache

              if [ ! -s /pvc/config/config.php ]; then
                printf '%s\n' \
                  '<?php' \
                  '$databaseServer   = getenv("DB_HOST");' \
                  '$databaseUsername = getenv("DB_USER");' \
                  '$databasePassword = getenv("DB_PASSWORD");' \
                  '$databaseName     = getenv("DB_NAME");' \
                  '$guid = getenv("GIBBON_GUID");' \
                  'if (!$guid) {' \
                  '  $guidFile = __DIR__ . "/../.gibbon_guid";' \
                  '  if (is_readable($guidFile)) { $guid = trim(file_get_contents($guidFile)); }' \
                  '}' \
                  '$caching     = 10;' \
                  '$absoluteURL = getenv("ABSOLUTE_URL");' \
                > /pvc/config/config.php
                chmod 660 /pvc/config/config.php || true
              fi
              # Seed/sync locales using a marker file to avoid 'ls' with set -e

              if [ ! -f "$DST/.seeded" ]; then
                echo "[Init] seeding locales -> $DST"
                if [ -d "$SRC" ]; then
                  cp -r "$SRC"/. "$DST"/ 2>/dev/null || true
                else
                  echo "[WARN] $SRC not found; skipping seed"
                fi
              else
                echo "[Init] Syncing any new locales..."
                if [ -d "$SRC" ]; then
                  for d in "$SRC"/*; do
                    n="$(basename "$d")"
                    [ -e "$DST/$n" ] || cp -r "$d" "$DST/$n" 2>/dev/null || true
                  done
                  if [ -f "$SRC/vi_VN/LC_MESSAGES/gibbon.mo" ]; then
                    mkdir -p "$DST/vi_VN/LC_MESSAGES"
                    cp -f "$SRC/vi_VN/LC_MESSAGES/gibbon.mo" "$DST/vi_VN/LC_MESSAGES/gibbon.mo" 2>/dev/null || true
                  fi
                fi
              fi

              chown -R 33:33 "$DST" 2>/dev/null || true
              chmod -R u+rwX,g+rwX "$DST" 2>/dev/null || true
              chmod -R 0777 /var/www/html/gibbon/uploads 2>/dev/null || true
          env:
            - name: DB_HOST
              value: gibbon-dev-mysql.gibbon-dev-deploy.svc.cluster.local
            - name: DB_NAME
              value: gibbon
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: password
            - name: ABSOLUTE_URL
              value: "https://gibbon-dev.vanhoa.edu.vn"
          volumeMounts:
            - name: uploads
              mountPath: /pvc
            - name: uploads
              mountPath: /var/www/html/gibbon/uploads
      containers:
        - name: gibbon
          image: ntony3419/gibbon:v29-fixed-path
          imagePullPolicy: Always
          command: ["/bin/sh","-c"]
          args: ["apache2ctl -D FOREGROUND"]
          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          ports:
            - containerPort: 80
          env:
            - name: DB_HOST
              value: gibbon-dev-mysql.gibbon-dev-deploy.svc.cluster.local
            - name: DB_NAME
              value: gibbon
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gibbon-dev-db-secret
                  key: password
            - name: ABSOLUTE_URL
              value: "https://gibbon-dev.vanhoa.edu.vn"
          volumeMounts:
            - name: uploads
              mountPath: /var/www/html/gibbon/uploads
            - name: uploads
              mountPath: /var/www/html/gibbon/config.php
              subPath: config/config.php
              readOnly: true
            - name: uploads
              mountPath: /var/www/html/gibbon/resources/locale
              subPath: locale
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: gibbon-dev-uploads-pvc
